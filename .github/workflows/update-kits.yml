name: Обновить комплекты из VK

on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов
  workflow_dispatch:          # и вручную: вкладка Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: update-kits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Забрать товары из VK
        run: node scripts/fetch-kits.mjs
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kits.json img/market
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "Обновить комплекты из VK"
            git push
          fi
