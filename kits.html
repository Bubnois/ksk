<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Готовые комплекты | Коскина — студия брейдинга в Омске</title>
  <meta name="description" content="Готовые комплекты для дредов, кос и локонов от студии брейдинга «Коскина» в Омске. Более 30 комплектов в наличии.">
  <meta name="theme-color" content="#F5F5F3">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400..700&family=Inter:wght@400..700&family=Jost:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        // брейкпоинты отключены: на любой ширине работает мобильная вёрстка, на десктопе она стоит
        // колонкой посередине (ширина — переменная --col в css ниже). Десктопные правки пишем с префиксом desk:
        // (≥768px), прежние md: в разметке остаются выключенными
        screens: { sm: '99999px', md: '99999px', lg: '99999px', xl: '99999px', '2xl': '99999px', desk: '768px' },
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['Comfortaa', 'cursive', 'sans-serif'],
            iskra: ['Iskra', 'Jost', 'sans-serif'],
          },
          colors: {
            'bg-primary': '#F5F5F3',
            'text-primary': '#1A1A1A',
            'text-secondary': '#555555',
            'accent-orange': '#FF7A59',
            'btn-dark': '#2D2C2A',
          },
          animation: {
            'draw-line': 'drawLine 3s ease-in-out infinite alternate',
            'float': 'float 3s ease-in-out infinite',
            'modal': 'modalFadeIn 0.3s ease-out forwards',
          },
          keyframes: {
            drawLine: {
              '0%': { strokeDashoffset: '640' },
              '100%': { strokeDashoffset: '0' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            modalFadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    :root { --col: max(480px, calc(50vw + 240px)); }
    .page-col { width: 100%; max-width: var(--col); margin: 0 auto; }
    body { background-color: #F5F5F3; color: #1A1A1A; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
    :focus-visible { outline: 2px solid #FF7A59; outline-offset: 3px; }
    .kit-card:focus-visible { border-radius: 32px; }
    body.modal-open { overflow: hidden; }
  </style>
</head>
<body class="bg-bg-primary">

  <header id="main-header" class="fixed top-0 left-0 w-full z-50 py-4 desk:py-6 mix-blend-difference">
    <div class="page-col px-4 flex flex-row justify-between items-center text-white">
      <a href="index.html" aria-label="Коскина — студия брейдинга, на главную" class="flex flex-col justify-between h-9 desk:h-11 w-max select-none no-underline text-white"><span class="contents" aria-hidden="true">
        <div class="flex justify-between w-full text-[0.5rem] desk:text-[0.65rem] leading-none uppercase tracking-wider">
          <span>С</span><span>т</span><span>у</span><span>д</span><span>и</span><span>я</span>
          <span class="w-1 desk:w-2"></span>
          <span>б</span><span>р</span><span>е</span><span>й</span><span>д</span><span>и</span><span>н</span><span>г</span><span>а</span>
        </div>
        <div class="flex justify-between w-full text-lg desk:text-2xl leading-none font-bold uppercase font-iskra">
          <span>К</span><span>о</span><span>с</span><span>к</span><span>и</span><span>н</span><span>а</span>
        </div>
      </span></a>
      <a href="index.html#contacts" class="h-9 desk:h-11 px-6 rounded-full bg-white text-black text-xs desk:text-sm font-medium hover:bg-gray-100 transition-colors no-underline flex items-center">Записаться</a>
    </div>
  </header>

  <main class="page-col px-4 pt-28 desk:pt-40 pb-20 desk:pb-28">
    <a href="index.html" class="inline-flex items-center gap-1 text-sm text-text-secondary hover:text-accent-orange transition-colors no-underline mb-6">
      <span aria-hidden="true" class="material-icons text-base">arrow_back</span>На главную
    </a>

    <div class="text-center mb-8 desk:mb-12">
      <h1 class="text-4xl desk:text-6xl font-display mb-4 tracking-tight">Готовые комплекты</h1>
      <p class="text-text-secondary text-sm desk:text-base leading-relaxed max-w-2xl mx-auto">
        Изготавливаем самые разнообразные комплекты. Если нужного нет в наличии, сделаем на любой вкус и любой сложности
      </p>
    </div>

    <div class="max-w-md mx-auto mb-8 desk:mb-10">
      <label for="kit-search" class="sr-only">Поиск по комплектам</label>
      <input id="kit-search" type="search" placeholder="Найти комплект" autocomplete="off"
        class="w-full h-12 px-6 rounded-full border border-black/10 bg-white text-sm outline-none focus:border-accent-orange transition-colors">
    </div>

    <div id="kits-grid" class="grid grid-cols-2 desk:grid-cols-3 gap-3 desk:gap-6"></div>

    <p id="kits-status" class="text-center text-text-secondary text-sm mt-8" role="status">Загружаем комплекты…</p>

    <div class="text-center mt-8">
      <button id="kits-more" type="button" class="hidden h-11 px-8 rounded-full bg-btn-dark text-white text-sm font-medium border-none cursor-pointer hover:bg-black transition-colors">Показать ещё</button>
    </div>

    <p class="text-center text-sm text-text-secondary mt-12">
      Весь каталог также в <a href="https://vk.com/market-211294353" target="_blank" rel="noopener noreferrer" class="text-accent-orange">ВКонтакте</a>
    </p>
  </main>

  <!-- карточка комплекта -->
  <div id="kit-modal" class="hidden fixed inset-0 z-[60] items-center justify-center p-4 bg-black/70" role="dialog" aria-modal="true" aria-labelledby="kit-modal-title">
    <div class="relative bg-bg-primary rounded-[32px] w-full max-w-[56rem] max-h-[90vh] overflow-y-auto flex flex-col desk:flex-row animate-modal">
      <button id="kit-modal-close" type="button" aria-label="Закрыть" class="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-white/90 border-none cursor-pointer flex items-center justify-center shadow-md hover:bg-white">
        <span aria-hidden="true" class="material-icons">close</span>
      </button>
      <div class="w-full desk:w-1/2 aspect-square shrink-0 bg-black/5">
        <img id="kit-modal-img" src="" alt="" class="w-full h-full object-cover">
      </div>
      <div class="p-6 desk:p-10 flex flex-col gap-4 desk:w-1/2">
        <h2 id="kit-modal-title" class="text-2xl font-display font-bold pr-10 desk:pr-0"></h2>
        <p id="kit-modal-price" class="text-lg text-accent-orange font-medium"></p>
        <p id="kit-modal-desc" class="text-text-secondary text-sm leading-relaxed whitespace-pre-line"></p>
        <a id="kit-modal-link" href="#" target="_blank" rel="noopener noreferrer" class="mt-2 self-start bg-accent-orange text-white px-6 py-3 rounded-full text-sm font-medium shadow-md no-underline hover:scale-105 transition-transform">Заказать во ВКонтакте</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const PAGE = 12;
      const VK_MARKET = 'https://vk.com/market-211294353';
      const grid = document.getElementById('kits-grid');
      const status = document.getElementById('kits-status');
      const moreBtn = document.getElementById('kits-more');
      const search = document.getElementById('kit-search');
      const modal = document.getElementById('kit-modal');
      let all = [], shown = 0, filtered = [], lastFocus = null;

      // всё, что пришло из VK, вставляем только как текст
      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function card(item) {
        const b = el('button', 'kit-card group text-left w-full flex flex-col gap-3 cursor-pointer bg-transparent border-0 p-0');
        b.type = 'button';
        const box = el('div', 'w-full aspect-square rounded-[32px] overflow-hidden relative border border-black/5 bg-black/5');
        if (item.image) {
          const img = el('img', 'w-full h-full object-cover transition-transform duration-700 group-hover:scale-105');
          img.src = item.image; img.alt = item.title; img.loading = 'lazy'; img.decoding = 'async';
          box.appendChild(img);
        }
        const arrow = el('div', 'absolute bottom-4 right-4 flex items-center justify-center text-btn-dark transition-transform duration-300 group-hover:-translate-y-1 group-hover:translate-x-1');
        const icon = el('span', 'material-icons text-3xl', 'arrow_outward');
        icon.setAttribute('aria-hidden', 'true');
        arrow.appendChild(icon); box.appendChild(arrow);
        const cap = el('div', 'px-2');
        cap.appendChild(el('h3', 'text-sm desk:text-base font-medium leading-snug group-hover:text-accent-orange transition-colors', item.title));
        if (item.price) cap.appendChild(el('p', 'text-sm text-text-secondary', item.price));
        b.append(box, cap);
        b.addEventListener('click', () => openModal(item, b));
        return b;
      }

      function renderMore() {
        const next = filtered.slice(shown, shown + PAGE);
        next.forEach(i => grid.appendChild(card(i)));
        shown += next.length;
        moreBtn.classList.toggle('hidden', shown >= filtered.length);
      }

      function applyFilter() {
        const q = search.value.trim().toLowerCase();
        filtered = q ? all.filter(i => (i.title + ' ' + i.description).toLowerCase().includes(q)) : all;
        grid.textContent = ''; shown = 0;
        renderMore();
        status.textContent = filtered.length ? '' : (q ? 'Ничего не нашлось. Попробуйте другой запрос.' : '');
        status.classList.toggle('hidden', filtered.length > 0);
      }

      function openModal(item, trigger) {
        lastFocus = trigger;
        document.getElementById('kit-modal-title').textContent = item.title;
        document.getElementById('kit-modal-price').textContent = item.price || '';
        document.getElementById('kit-modal-desc').textContent = item.description || '';
        const img = document.getElementById('kit-modal-img');
        img.src = item.image || ''; img.alt = item.title;
        document.getElementById('kit-modal-link').href = item.url || VK_MARKET;
        modal.classList.remove('hidden'); modal.classList.add('flex');
        document.body.classList.add('modal-open');
        document.getElementById('kit-modal-close').focus();
      }
      function closeModal() {
        modal.classList.add('hidden'); modal.classList.remove('flex');
        document.body.classList.remove('modal-open');
        if (lastFocus) lastFocus.focus();
      }
      document.getElementById('kit-modal-close').addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal(); });

      moreBtn.addEventListener('click', renderMore);
      search.addEventListener('input', applyFilter);

      function fail() {
        status.textContent = '';
        const p = status;
        p.append('Не получилось загрузить каталог. Посмотрите комплекты ');
        const a = el('a', 'text-accent-orange', 'во ВКонтакте');
        a.href = VK_MARKET; a.target = '_blank'; a.rel = 'noopener noreferrer';
        p.append(a, '.');
      }

      fetch('kits.json', { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(data => {
          all = (data.items || []).filter(i => i && i.title);
          if (!all.length) return fail();
          status.textContent = '';
          applyFilter();
        })
        .catch(fail);
    })();
  </script>
</body>
</html>
